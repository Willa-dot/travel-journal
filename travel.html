<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Travel Detail</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<section class="detail">


    <!-- 标题 -->

    <h1 id="title"></h1>


    <!-- 地点 -->

    <p id="location"></p>


    <!-- 信息标签 -->

    <div class="info">

        <p id="type"></p>

        <p id="date"></p>

        <p id="distance"></p>

        <p id="route"></p>

        <p id="difficulty"></p>

    </div>



    <!-- 封面图片 -->

    <img 
    id="cover" 
    class="cover-img"
    >



    <!-- 旅行介绍 -->

    <p id="description"></p>



    <!-- 图片墙标题 -->

    <h2>Photos</h2>



    <!-- 图片墙 -->

    <div class="gallery">

    </div>



</section>




<!-- 图片放大弹窗 -->

<div class="lightbox">


    <span class="close">
        ×
    </span>


    <img 
    id="lightbox-img"
    >


</div>





<script src="detail.js"></script>


</body>


</html>
